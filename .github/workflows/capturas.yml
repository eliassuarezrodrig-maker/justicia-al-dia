name: Capturas de diseño
on: workflow_dispatch
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8080 &) && sleep 2 && node tools/capturas.mjs
      - run: |
          git config user.name "justicia-al-dia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capturas && git commit -m "Capturas de diseño" && git pull --rebase && git push
