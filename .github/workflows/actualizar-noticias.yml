name: Actualizar noticias

on:
  schedule:
    # 7:00, 14:00 y 20:00 en Canarias (UTC en invierno; en verano se adelanta una hora)
    - cron: '0 7,14,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Recopilar noticias
        run: node scripts/fetch-news.mjs
      - name: Guardar cambios
        run: |
          git config user.name "justicia-al-dia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar noticias $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
