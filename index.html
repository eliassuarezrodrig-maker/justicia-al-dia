<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Justicia al día</title>
  <meta name="description" content="Noticias judiciales, sentencias y boletines oficiales: España, Canarias, Europa e internacional.">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-row">
      <a class="brand" href="#portada" aria-label="Justicia al día, portada">
        <img src="icons/icon.svg" alt="" width="42" height="42">
        <span class="brand-text"><span class="brand-name">JUSTICIA</span><span class="brand-tag">AL DÍA</span></span>
      </a>
      <div class="masthead-side">
        <span class="today" id="today"></span>
        <button class="icon-btn" id="searchToggle" aria-label="Buscar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <div class="wrap tabs-row">
        <a href="#portada" data-tab="portada"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Portada</a>
        <a href="#sentencias" data-tab="sentencias"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg>Sentencias</a>
        <a href="#nacional" data-tab="nacional"><svg class="ico" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M3 10l9-6 9 6"/></svg>Nacional</a>
        <a href="#canarias" data-tab="canarias"><svg class="ico" viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>Canarias</a>
        <a href="#europa" data-tab="europa"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v.01M16.3 9.5v.01M16.3 14.5v.01M12 17v.01M7.7 14.5v.01M7.7 9.5v.01"/></svg>Europa</a>
        <a href="#internacional" data-tab="internacional"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Internacional</a>
        <a href="#colecciones" data-tab="colecciones"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Colecciones <span class="badge" id="colBadge"></span></a>
      </div>
    </nav>
  </header>

  <div class="searchbar" id="searchbar" hidden>
    <div class="wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar en todas las noticias: despido, hipoteca, TJUE…" autocomplete="off" enterkeyhint="search">
    </div>
  </div>

  <main class="wrap" id="view" aria-live="polite"></main>

  <footer class="wrap site-foot">
    <p id="updated"></p>
    <details>
      <summary>Estado de las fuentes</summary>
      <ul id="status"></ul>
    </details>
  </footer>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h3 id="sheetTitle">Guardar en colección</h3>
        <button class="icon-btn dark" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <p class="sheet-news" id="sheetNews"></p>
      <ul class="sheet-list" id="sheetList"></ul>
      <form class="sheet-new" id="sheetNew">
        <input id="newCol" placeholder="Nueva colección (p. ej. TFG, Laboral…)" maxlength="40">
        <button type="submit">Crear</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
